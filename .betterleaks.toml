# The tests of a masking library have to carry values shaped like real
# credentials, and betterleaks reports them as it should. Every such value in a
# test is built from the ordered run 0123456789abcdef, which no real credential
# is, so those are the values allowed. A credential written any other way is
# still reported, in a test as anywhere else.
#
# The run is allowed in either case, because the case is the credential's to
# choose: an AWS access key ID is written in uppercase and digits alone, so a
# value of that kind built from the run carries 0123456789ABCDEF and could not
# carry the other. Both spellings are the same sixteen ordered characters, and
# a value built from neither is reported as before.
#
# A credential whose format is a UUID cannot carry the run unbroken, for the
# same reason and one step further: its four separators fall inside the
# characters rather than beside them, so the run written in that layout is
# 01234567-89ab-cdef-0123-456789abcdef, which is the same sixteen ordered
# characters twice over with the hyphens a UUID puts through them. Both cases of
# that spelling are allowed as well, and a UUID written from anything but the
# run is reported as before.
#
# The conformance corpus carries them too. It is a test in every sense but the
# file extension — the cases under conformance/testdata are what the package
# beside them is driven with — so the same rule covers it, and covers nothing
# else: a value built any other way is reported there as well.
#
# So does the rationale of a built-in pattern. What each builtin_*.go says about
# where a scan stops is written with the value it stops in the middle of, which
# is what lets a reader check the sentence rather than take it — the four
# characters an access key ID leaves behind are named by writing the run they
# are the end of. Those values are built from the same ordered run for the same
# reason, and the condition on them is the same one: a credential written any
# other way is reported in a pattern's file as anywhere else.
#
# Where the run stands is asked for as well as that it stands somewhere. A value
# of this kind is a vendor's prefix and then a body, and the run is the body: it
# opens the value, or it opens the body behind the separator the prefix closes
# with. Asking only that the run be present asks nothing at all of a real
# credential with the run written across the middle of it, which is a value half
# rewritten by hand and the one shape this entry would otherwise hide. So the
# run is asked for within nine characters of the beginning of the value or of a
# separator inside it. Nine is what the corpus reaches: a vendor's marker
# written against a body with no separator between them is AKIA, AIza, dapi or
# GR1348941, and none of them is longer.
#
# Some vendors write a fixed string of their own in front of the body, longer
# than any marker: a PyPI token carries the index it was issued against, encoded
# into the token, and a PlanetScale token carries a JWT header. Those strings
# are named in the regexes below, so that the body behind one is read as a body.
# There is one of them per index the PyPI cases are written for rather than one
# for the vendor, because the string is the index's name and not the vendor's.
# A string arriving tomorrow that is named nowhere below is reported until it
# is, which is the side to fail on — the entry stops covering what it has not
# been told about rather than covering it silently.
#
# What it gives up is a real credential with the run written over the opening of
# its body. The run does not fall there by chance: sixteen ordered characters in
# an alphabet of sixty-two is nothing a generator writes, so what is given up is
# a value somebody rewrote by hand and stopped rewriting partway, and the line
# it is written on is a line a reviewer reads.

[extend]
useDefault = true

[[allowlists]]
description = "credentials made of ordered characters, written into a test or a pattern's rationale"
condition = "AND"
paths = ['''_test\.go$''', '''conformance/testdata/[^/]+\.txt$''', '''(^|/)builtin_[a-z0-9_]+\.go$''']
regexTarget = "secret"
regexes = [
  '''(?:^|[^0-9A-Za-z])(?:AgEIcHlwaS5vcmc|AgENdGVzdC5weXBpLm9yZw|AgEEeC5pbw|eyJhbGciOiJIUzI1NiJ9)?[0-9A-Za-z]{0,9}0123456789abcdef''',
  '''(?:^|[^0-9A-Za-z])(?:AgEIcHlwaS5vcmc|AgENdGVzdC5weXBpLm9yZw|AgEEeC5pbw|eyJhbGciOiJIUzI1NiJ9)?[0-9A-Za-z]{0,9}0123456789ABCDEF''',
  '''(?:^|[^0-9A-Za-z])(?:AgEIcHlwaS5vcmc|AgENdGVzdC5weXBpLm9yZw|AgEEeC5pbw|eyJhbGciOiJIUzI1NiJ9)?[0-9A-Za-z]{0,9}01234567-89ab-cdef-0123-456789abcdef''',
  '''(?:^|[^0-9A-Za-z])(?:AgEIcHlwaS5vcmc|AgENdGVzdC5weXBpLm9yZw|AgEEeC5pbw|eyJhbGciOiJIUzI1NiJ9)?[0-9A-Za-z]{0,9}01234567-89AB-CDEF-0123-456789ABCDEF''',
]

# The corpus writes a redaction as the pattern's name between guillemets, and a
# rule that reads the line around a value reports the marker as the value that
# stood there: a clone URL writes one where a token goes, a .pypirc where a
# password goes. What is reported is the library's own output — what says the
# value was found and taken out — rather than anything anyone wrote.
#
# What a rule captures around the marker is that rule's own business, and it is
# not always the marker alone. curl -u takes a user and a password divided by a
# colon, so the rule reading one captures whichever half the marker did not
# fill: «tailscale-key»: where a key is written as the user, and
# anystring:«mailchimp-api-key» where it is written as the password. So this
# asks that the reported value carry a marker rather than that it be one.
# Asking the second would leave the entry narrower than the reasoning it rests
# on: pairing two values is what an authorization header, a connection string and
# a command line all do, so a corpus case written in any of them reports a marker
# with the other half attached.
#
# That the marker is output is the notation's doing and not a habit. A guillemet
# reaches a corpus file in an `out` field and nowhere else: the corpus reader
# rejects the file over either character standing on any other line, and over
# one an `in` field carries decoded, so what is left is the field -update
# generates from what Mask returned. A capture holding a marker is therefore a
# capture spanning a redaction, and whatever the rule took itself to have found,
# the value that stood in that slot is the one thing it cannot still be reading.
# So this rests on the shape of the value as the entries above do, and the path
# says which files are written in that notation.
#
# It is written to no rule, and that is the point of it. A marker is no value
# under the rule for a password, none under the rule for a connection URI, and
# none under a rule the ruleset adds tomorrow; naming the two that report one
# today would leave the third to be found by whoever hits it.
#
# The name between the guillemets is lowercase letters, digits and hyphens,
# which is the convention Pattern.Name asks for and Test_builtins_name holds the
# built-ins to. A corpus pattern of the harness's own is under nothing but that
# example, so a name written outside those characters is reported here — which
# is the side to fail on. Every guillemet the reported value carries has to
# belong to such a name, so one left unclosed, or written around a name the
# convention leaves out, is reported rather than allowed. What may stand beside a
# marker carries no line break for the same reason: a finding reaching across
# lines is one whose rule read past the case it began in, and a marker on one of
# those lines says nothing about what the others hold.
#
# What may stand beside a marker is bounded at twelve characters a stretch, and
# that bound is what keeps a credential from riding along with one. An out line
# pairs a marker with whatever else the case wrote, and some of them write a
# value this library does not locate: sk-or-v1-, sk_live_ and sb_secret_ each
# stand directly against a marker somewhere in this corpus. A rule capturing both
# halves of such a line is allowed by an entry asking only that a marker be in
# there somewhere, and curl-auth-user captures exactly that shape. It is bounded
# a stretch at a time rather than over the whole: a credential is one unbroken
# run, so what two stretches come to between them says nothing about whether
# either could hold one.
#
# Twelve is the first width above what the corpus asks for, which is what keeps
# the bound from being a taste. Of everything this entry allows today, two
# captures carry anything beside the marker at all: "anystring:«…»" and "«…»:",
# the two halves of curl's basic authentication with the quotes the rule takes
# in. The widest stretch in either is "anystring: at eleven characters, and every
# other capture the entry allows is a marker and nothing else.
#
# Raising it is a decision about what this entry allows, not a fit to whatever a
# corpus case grew to. A capture reaching the bound is reported rather than
# allowed, which is the direction to fail in — the scan says so and somebody
# reads the line. What raising it buys is that capture passing; what it sells is
# every credential of the new width that can stand beside a marker — and a
# credential that short is a shape this corpus already writes, tskey-auth-0-1
# being fourteen characters and located whole.
#
# What it gives up is a value of twelve characters or fewer sharing a capture
# with a marker. A rule whose capture holds a redaction and something short
# written beside it has both allowed at once: a connection string whose password
# this library located and whose user name it did not, or a command line pairing
# a key it reads with a second one it does not.
#
# What that rests on is the corpus being written rather than collected. Every
# value in these files is built by hand from an ordered run, which
# conformance/CLAUDE.md asks for and each file's own header writes out, so what
# stands beside a marker is a value somebody composed out of ordered characters
# — and the case that would cost something here is a real credential typed into
# a corpus file beside a redaction. Every pattern added inherits this, which is
# what it is for: a built-in arrives with corpus cases whose out lines carry its
# marker, and none of them is allowed by hand.
[[allowlists]]
description = "the marker a redaction is written as, which is the library's output rather than a value"
condition = "AND"
paths = ['''conformance/testdata/[^/]+\.txt$''']
regexTarget = "secret"
regexes = ['''^[^«»\r\n]{0,12}(?:«[a-z0-9-]+»[^«»\r\n]{0,12})+$''']

# An age secret key cannot carry the run either, and the reason is the alphabet
# it is written in rather than anything about where it is written. Bech32 leaves
# 1 and B out of its character set — the first is the separator that closes the
# human-readable part, the second is one of the letters the set is chosen
# without — so the run
# stops being ordered characters the moment it reaches either. What is asked for
# instead is the run those two are taken out of, which is as much of it as the
# format admits, under the same paths and the same case as above: a key written
# any other way is reported as before. Where the run has to stand is what the
# entry above asks of its own, and for the reason given there.
[[allowlists]]
description = "age secret keys made of the ordered characters Bech32 admits, written into a test or a pattern's rationale"
condition = "AND"
targetRules = ["age-secret-key"]
paths = ['''_test\.go$''', '''conformance/testdata/[^/]+\.txt$''', '''(^|/)builtin_[a-z0-9_]+\.go$''']
regexTarget = "secret"
regexes = ['''(?:^|[^0-9A-Za-z])[0-9A-Za-z]{0,9}023456789ACDEF''']

# The private key pattern is a place the ordered run cannot be asked for, and
# the reason is what the rule reports rather than what the tests hold. The
# private-key rule matches a region and not a value: it opens on a BEGIN
# boundary and closes on the next END one, over whatever stands between, so in a
# file that writes those boundaries case after case the secret it reports is a
# stretch of source — the tail of one case, the Go or the notation between them,
# the head of the next. Whether the ordered run falls inside such a stretch is
# decided by where the cases were written and not by what any of them holds, and
# the cases that state a boundary with nothing behind it, or a body the scan
# must turn away, carry no run to be found at all.
#
# So this rests on the rule and the paths, which is weaker than the condition
# above and is why it is written to that one rule rather than added to it. What
# it gives up is a real private key pasted into a test of this package or into
# the corpus. What stands in its place is that every value in those files is
# written out by hand from the ordered run, which is a line a reviewer reads —
# and that a private key is the one credential whose armor announces what it is,
# so a body that is not the run is not something a reader has to recognise.

[[allowlists]]
description = "the armor the private key pattern is written about, which is never a key"
targetRules = ["private-key"]
paths = ['''_test\.go$''', '''conformance/testdata/[^/]+\.txt$''', '''(^|/)builtin_[a-z0-9_]+\.go$''']

# The rule for Airtable's user API key reads the vendor's name and then any
# seventeen letters and digits standing behind a separator, and one line of
# vendors_test.go is exactly that by accident: the accessor "AirtablePatterns"
# carries the vendor's name, and the entry written under it in the same table
# names "AnthropicPatterns", which is seventeen characters. Neither can be
# spelled differently — one is a vendor's name and so is the other — and the two
# stand together because the table is in alphabetical order.
#
# So this is a different kind of thing from the three above, and the difference
# is worth naming. Those allow a value — a string shaped like a credential,
# written from the ordered run so that a reader can see it is not one. Here
# there is no value at all. What was reported is the name of a function standing
# beside the name of another, and the two of them happened to fall inside the
# window this rule is written with.
#
# What it gives up is correspondingly narrow: a genuine user API key of that
# retired shape, written into vendors_test.go, on a line that also carries the
# string AnthropicPatterns. Narrower still for what the credential is — it
# stopped authenticating on 1 February 2024, when Airtable finished a
# deprecation it began in January 2023.
#
# The third condition is what makes it that narrow, and it is worth knowing how
# it ends. Insert a vendor between Airtable and Anthropic and the match no
# longer carries AnthropicPatterns; this entry stops applying, and it stops
# applying silently — no test holds it, and nothing here fails. What happens
# instead is that the collision is reported again, wherever it has moved to, for
# whoever moved it to read.
[[allowlists]]
description = "one accessor's name beside another's in vendors_test.go, which the rule for a credential Airtable retired reads as a key"
condition = "AND"
targetRules = ["airtable-api-key"]
paths = ['''(^|/)vendors_test\.go$''']
regexTarget = "match"
regexes = ['''AnthropicPatterns''']

# The rule for a hardcoded password reads what stands between the quotes behind
# the key, and one line of builtin_pypi_api_token_test.go writes a Go expression
# where that string would go. A benchmark builds a .pypirc line by joining the
# key, a variable holding the token and a newline, so the quote the rule opens
# on is the one closing the first piece and the quote it closes on is the one
# opening the last. What falls between them is the name of the variable with a
# concatenation operator written against it on either side.
#
# So this is the same kind of thing as the entry above rather than the ones that
# allow a value: there is no value here at all. What was reported reads as a
# string only because the quotes either side of it belong to the pieces around
# it.
#
# It is written to the one file for the reason the entry above is written to
# one. The shape is Go's rather than this file's, so another test joining a line
# that way would carry it too — and there it is reported again, wherever it has
# moved to, for whoever wrote it to read.
#
# What it gives up is a secret of that exact shape written into this one test: a
# plus sign, the characters a Go identifier is written with, and a plus sign.
# Base64 admits the plus sign, so an encoded body fenced by two of them and
# holding neither the slash nor a leading digit is given up with it.
#
# The rule named below arrived with betterleaks 1.8, so a binary older than the
# one mise.toml pins refuses this whole file rather than reading it: the name
# resolves to no rule and the load fails in front of any scan. That is the
# direction to fail in — an old binary says so, where one that read the file and
# skipped what it did not recognise would scan with an entry it had not
# understood.
[[allowlists]]
description = "the concatenation around a variable's name in a Go test, which the rule for a hardcoded password reads as one"
condition = "AND"
targetRules = ["generic-password"]
paths = ['''(^|/)builtin_pypi_api_token_test\.go$''']
regexTarget = "secret"
regexes = ['''^\+[A-Za-z_][A-Za-z0-9_]*\+$''']

# Three values the corpus wrote where a key for a password goes, in place of the
# ordered run the entry at the top of this file asks for: hunter2 in
# text_shapes.txt, s3cr3t-value and something-else in custom_patterns.txt. Those
# files carry the run and are reported nowhere; what this is written to is the
# two commits that wrote the three, not the files.
#
# betterleaks reads the diffs git log gives it rather than the working tree,
# which is what the depth the workflow checks out is for: a value committed and
# taken out again is gone from the tree and still in the history. So editing a
# value settles what is scanned from here on and settles nothing about the
# commit it was written in, and the commit is the only place these three are
# still read.
#
# So the commits are what this is written to, where every other entry here is
# written to a shape. A shape is the right key for a value that will be written
# again — the ordered run is asked for of every corpus case there will ever be —
# and the wrong one here, because these three strings are finished: no corpus
# case is written with them, and an entry allowing them by shape would go on
# allowing them, so writing hunter2 back into a case tomorrow would pass. Named
# by commit, it permits nothing going forward at all. A value written into the
# corpus tomorrow lands in a commit no line here names and is reported as
# before.
#
# The rule, the paths and the three values are asked for beside the commits, so
# a finding in these same commits that is none of the three is reported as well.
#
# What it gives up is a credential that is one of these three strings exactly,
# added to a corpus file by one of these two commits. Both are in the history of
# a published module, so what stands in their place is that the two can be read:
# one lays every corpus field out to a column, the other is the commit the
# corpus arrived in.
#
# The commits are what makes it that narrow, and it is worth knowing how it
# ends. A SHA names a commit as it stands, so a history rewritten — a rebase, a
# filter, either of these two amended — leaves both names pointing at nothing.
# This entry stops applying then, and it stops applying the way the one for
# vendors_test.go does: nothing here fails, and the three values are reported
# again, under whatever SHAs they were carried to, for whoever carried them
# there to read. That is the side to fail on, and it is why the two are written
# out rather than reached by a range or a date, either of which would follow the
# values across a rewrite and go on allowing them.
[[allowlists]]
description = "the corpus values since rebuilt from the ordered run, in the two commits that wrote them"
condition = "AND"
targetRules = ["generic-password"]
commits = [
  "0003bd3d3e3fa0ded48ec6bb4ea241dc887d1011",
  "c14e881dff80198691e72a33ec1da9ee11d29718",
]
paths = ['''conformance/testdata/[^/]+\.txt$''']
regexTarget = "secret"
regexes = [
  '''^hunter2$''',
  '''^s3cr3t-value$''',
  '''^something-else$''',
]

# A fuzz corpus cannot be asked for the ordered run either. What is
# under testdata/fuzz is written by the fuzzer, not by anyone: an input that
# found a failure is kept so that it is checked from then on, and it is whatever
# the fuzzer arrived at — which, for targets seeded from the corpus above, is
# credential shaped often enough that a failure worth keeping could not be
# committed at all.
#
# What is asked for instead is the shape of the line go test writes an input on:
# string(...) or []byte(...). That covers every input a fuzzer kept and nothing
# else, so a credential dropped into one of these directories by hand is still
# reported.
[[allowlists]]
description = "inputs a fuzz target kept, which nobody wrote"
condition = "AND"
paths = ['''(^|/)testdata/fuzz/''']
regexTarget = "line"
regexes = ['''^\s*(string|\[\]byte)\(''']
