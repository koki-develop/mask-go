# The tests of a masking library have to carry values shaped like real
# credentials, and betterleaks reports them as it should. Every such value in a
# test is built from the ordered run 0123456789abcdef, which no real credential
# is, so those alone are allowed. A credential written any other way is still
# reported, in a test as anywhere else.
#
# The run is allowed in either case, because the case is the credential's to
# choose: an AWS access key ID is written in uppercase and digits alone, so a
# value of that kind built from the run carries 0123456789ABCDEF and could not
# carry the other. Both spellings are the same sixteen ordered characters, and
# a value built from neither is reported as before.
#
# The conformance corpus carries them too. It is a test in every sense but the
# file extension — the cases under conformance/testdata are what the package
# beside them is driven with — so the same rule covers it, and covers nothing
# else: a value built any other way is reported there as well.
#
# So does the rationale of a built-in pattern. What each builtin_*.go says about
# where a scan stops is written with the value it stops in the middle of, which
# is what lets a reader check the sentence rather than take it — the four
# characters an access key ID leaves behind are named by writing the run they
# are the end of. Those values are built from the same ordered run for the same
# reason, and the condition on them is the same one: a credential written any
# other way is reported in a pattern's file as anywhere else.

[extend]
useDefault = true

[[allowlists]]
description = "credentials made of ordered characters, written into a test or a pattern's rationale"
condition = "AND"
paths = ['''_test\.go$''', '''conformance/testdata/[^/]+\.txt$''', '''(^|/)builtin_[a-z0-9_]+\.go$''']
regexTarget = "secret"
regexes = ['''0123456789abcdef''', '''0123456789ABCDEF''']

# The private key pattern is a place the ordered run cannot be asked for, and
# the reason is what the rule reports rather than what the tests hold. The
# private-key rule matches a region and not a value: it opens on a BEGIN
# boundary and closes on the next END one, over whatever stands between, so in a
# file that writes those boundaries case after case the secret it reports is a
# stretch of source — the tail of one case, the Go or the notation between them,
# the head of the next. Whether the ordered run falls inside such a stretch is
# decided by where the cases were written and not by what any of them holds, and
# the cases that state a boundary with nothing behind it, or a body the scan
# must turn away, carry no run to be found at all.
#
# So this rests on the rule and the paths, which is weaker than the condition
# above and is why it is written to that one rule rather than added to it. What
# it gives up is a real private key pasted into a test of this package or into
# the corpus. What stands in its place is that every value in those files is
# written out by hand from the ordered run, which is a line a reviewer reads —
# and that a private key is the one credential whose armor announces what it is,
# so a body that is not the run is not something a reader has to recognise.

[[allowlists]]
description = "the armor the private key pattern is written about, which is never a key"
targetRules = ["private-key"]
paths = ['''_test\.go$''', '''conformance/testdata/[^/]+\.txt$''', '''(^|/)builtin_[a-z0-9_]+\.go$''']

# The rule for Airtable's user API key reads the vendor's name and then any
# seventeen letters and digits standing behind a separator, and one line of
# vendors_test.go is exactly that by accident: the accessor "AirtablePatterns"
# carries the vendor's name, and the entry written under it in the same table
# names "AnthropicPatterns", which is seventeen characters. Neither can be
# spelled differently — one is a vendor's name and so is the other — and the two
# stand together because the table is in alphabetical order.
#
# So this is a different kind of thing from the three above, and the difference
# is worth naming. Those allow a value — a string shaped like a credential,
# written from the ordered run so that a reader can see it is not one. Here
# there is no value at all. What was reported is the name of a function standing
# beside the name of another, and the two of them happened to fall inside the
# window this rule is written with.
#
# What it gives up is correspondingly narrow: a genuine user API key of that
# retired shape, written into vendors_test.go, on a line that also carries the
# string AnthropicPatterns. Narrower still for what the credential is — it
# stopped authenticating on 1 February 2024, when Airtable finished a
# deprecation it began in January 2023.
#
# The third condition is what makes it that narrow, and it is worth knowing how
# it ends. Insert a vendor between Airtable and Anthropic and the match no
# longer carries AnthropicPatterns; this entry stops applying, and it stops
# applying silently — no test holds it, and nothing here fails. What happens
# instead is that the collision is reported again, wherever it has moved to, for
# whoever moved it to read.
[[allowlists]]
description = "one accessor's name beside another's in vendors_test.go, which the rule for a credential Airtable retired reads as a key"
condition = "AND"
targetRules = ["airtable-api-key"]
paths = ['''(^|/)vendors_test\.go$''']
regexTarget = "match"
regexes = ['''AnthropicPatterns''']

# A fuzz corpus cannot be asked for the ordered run either. What is
# under testdata/fuzz is written by the fuzzer, not by anyone: an input that
# found a failure is kept so that it is checked from then on, and it is whatever
# the fuzzer arrived at — which, for targets seeded from the corpus above, is
# credential shaped often enough that a failure worth keeping could not be
# committed at all.
#
# What is asked for instead is the shape of the line go test writes an input on:
# string(...) or []byte(...). That covers every input a fuzzer kept and nothing
# else, so a credential dropped into one of these directories by hand is still
# reported.
[[allowlists]]
description = "inputs a fuzz target kept, which nobody wrote"
condition = "AND"
paths = ['''(^|/)testdata/fuzz/''']
regexTarget = "line"
regexes = ['''^\s*(string|\[\]byte)\(''']
