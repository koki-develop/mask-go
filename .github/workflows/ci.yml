name: CI

permissions: {}

defaults:
  run:
    shell: bash

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is run twice, under the race detector and without it, and neither
  # run is a step of the other's job. Neither reads what the other leaves, so as
  # steps the shorter waits on the longer for nothing, and together they are the
  # longest thing on this workflow.
  test:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: save
      # Without the detector, deliberately. The race detector allocates on
      # paths that otherwise do not, so what holds this library to allocating
      # nothing stands down under it; without a run of its own it would never
      # run at all.
      - run: go test ./...

  # The run under the detector is a job a package rather than one job over them
  # all. The detector costs this suite about five times what it costs without,
  # and a runner has four cores. go test runs the package binaries together
  # already, so what a job apiece buys is not that the packages run at once: it
  # is four cores each rather than four cores between them, for as long as both
  # are running. A package apiece divides that where the division needs nothing
  # of the tests.
  #
  # The packages are written out here rather than listed by a job of their own,
  # and the fuzz targets below are not. A matrix reads its rows from a job that
  # has finished, so a listing costs a runner booted, a toolchain installed and
  # a checkout done in front of every job of the matrix — most of a minute
  # ahead of a run of two and a half, which is the wall clock this split is for.
  # The fuzzing pays that once for fifty-odd jobs it could not name by hand and
  # which no wall clock waits on; two rows would pay it for two.
  #
  # What the listing buys is that a package added to the module cannot go
  # untested, and the step below buys the same thing inside a job that is
  # running anyway: every row names a package of this module, and there are as
  # many rows as the module has packages. A package added without a row here
  # then fails the run rather than being quietly left out of it.
  test-race:
    name: test-race (${{ matrix.dir }})
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      # One package failing says nothing about whether the other does, and
      # which of them also failed is what a failure is read by.
      fail-fast: false
      matrix:
        include:
          # dir is what the job names itself by: the import path in full is too
          # long to read in a list of checks.
          - pkg: .
            dir: mask-go
          - pkg: ./conformance
            dir: conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every job of this matrix reads and fills one cache, the standard library
      # compiled under the detector being the same bytes for all of them. They
      # race for the key on the first run after the toolchain moves and none of
      # them after: actions/cache writes nothing back where it restored an exact
      # hit, so once one of them has filled it the rest only read it.
      - uses: ./.github/actions/setup
        with:
          cache: save
          build: race
      - name: Check that the matrix names every package
        env:
          PKG: ${{ matrix.pkg }}
          ROWS: ${{ strategy.job-total }}
        run: |
          # Assigned and their status checked rather than substituted into the
          # comparisons: a substitution that failed leaves the empty string, and
          # two empty strings are equal.
          if ! packages=$(go list ./...); then
            echo "listing the packages failed" >&2
            exit 1
          fi
          if ! mine=$(go list "$PKG"); then
            echo "listing $PKG failed" >&2
            exit 1
          fi
          count=$(printf '%s\n' "$packages" | grep -c .)
          if [ "$count" -ne "$ROWS" ]; then
            echo "go list reports $count package(s) and this matrix holds $ROWS row(s)" >&2
            exit 1
          fi
          # Not a pipe: grep -q leaves on its first match, and a writer caught
          # still writing dies of SIGPIPE, which pipefail reads as no match.
          if ! grep -qxF "$mine" <<<"$packages"; then
            echo "$mine is not a package of this module" >&2
            exit 1
          fi
      - env:
          PKG: ${{ matrix.pkg }}
        run: go test -race "$PKG"

  # A fuzz target is given its own job rather than a turn in a loop on one
  # runner. A loop is thirty seconds per target one after another, and this
  # repository grows by adding built-in patterns, each of which brings a target
  # of its own: the wall clock rises with the pattern count and nothing else on
  # the workflow comes close to it. A job apiece costs the same thirty seconds
  # however many targets there are. What is listed is what runs, so a target
  # added to the code is fuzzed without this file being touched.
  fuzz-list:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: List every fuzz target
        id: list
        run: |
          # A loop iterating over what a command substitution produced is where
          # errexit does not reach: the substitution can fail and the loop simply
          # runs no times. Both listings are therefore assigned first and their
          # status checked.
          if ! packages=$(go list ./...); then
            echo "listing the packages failed" >&2
            exit 1
          fi
          targets=()
          for pkg in $packages; do
            if ! listed=$(go test -list '^Fuzz' "$pkg"); then
              echo "listing the fuzz targets of $pkg failed" >&2
              exit 1
            fi
            for target in $(echo "$listed" | grep '^Fuzz'); do
              # dir is the package's last element, carried so that the job below
              # can name itself by it. Two packages may hold a target of the same
              # name, and two check runs reading "fuzz (FuzzText)" cannot be told
              # apart; the import path in full is too long to read in a list.
              if ! entry=$(jq -nc --arg pkg "$pkg" --arg target "$target" '{pkg: $pkg, target: $target, dir: ($pkg | split("/") | last)}'); then
                echo "describing $target ($pkg) failed" >&2
                exit 1
              fi
              targets+=("$entry")
            done
          done
          if ! matrix=$(printf '%s\n' "${targets[@]}" | jq -sc .); then
            echo "building the matrix failed" >&2
            exit 1
          fi
          echo "found ${#targets[@]} target(s): $matrix"
          echo "targets=$matrix" >> "$GITHUB_OUTPUT"

  fuzz-target:
    name: fuzz (${{ matrix.dir }}/${{ matrix.target }})
    needs: fuzz-list
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      # One target failing says nothing about whether the others do, and which
      # of them also fail is what a failure is read by. Stopping the rest would
      # throw that away to save runner time, which a public repository is not
      # billed for.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fuzz-list.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A plain go test runs a fuzz target over its corpus alone, which is the
      # inputs someone thought of. Every target is given a little time to look
      # for the ones nobody did.
      - name: Fuzz
        # The two reach the script through the environment rather than being
        # written into it: what the listing job reported is then data the shell
        # expands, not text it parses.
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        # go test can report a run that found nothing as a failure. It
        # suppresses the -fuzztime deadline by comparing the error its
        # coordinator woke on against the workers' child context, and context
        # closes a parent's done channel before handing the error down -- so the
        # coordinator can wake with the parent expired and the child not yet
        # cancelled, the comparison misses, and a quiet run exits 1 saying
        # "context deadline exceeded".
        run: |
          # tee so the elapsed lines stream; pipefail because the status read
          # below is tee's otherwise, and a run that found a crasher would exit
          # 0. The shell named at the top of this file sets it too.
          set -o pipefail
          fuzztime=30s
          log="$RUNNER_TEMP/fuzz.log"
          status=0
          go test -run '^$' -fuzz "^${TARGET}$" -fuzztime "$fuzztime" "$PKG" 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if ! out=$(cat "$log"); then
            echo "reading $log failed" >&2
            exit 1
          fi

          # The corpus settles it before the message does: a crash caught while
          # being minimized reaches testdata/fuzz from a defer but is named as
          # the failure only where the error is nil, so a lost race leaves it on
          # disk reported as nothing but the deadline.
          if ! crashers=$(git status --porcelain -- '*testdata/fuzz*'); then
            echo "listing testdata/fuzz failed" >&2
            exit 1
          fi
          if [ -n "$crashers" ]; then
            echo "fuzzing wrote a crasher to testdata/fuzz" >&2
            exit 1
          fi

          # The deadline alone and nothing else: any other detail line is a
          # failure this must not swallow.
          fails=$(grep -c '^--- FAIL: ' <<<"$out" || true)
          details=$({ grep '^    ' <<<"$out" || true; } | sed 's/^ *//' | sort -u)
          if [ "$fails" -eq 1 ] &&
            grep -q "^--- FAIL: ${TARGET} " <<<"$out" &&
            [ "$details" = "context deadline exceeded" ]; then
            echo "fuzzing found nothing in $fuzztime; go test reported the deadline as a failure" >&2
            exit 0
          fi

          exit "$status"

  # The name the fuzzing is read by from outside, kept to one row now that the
  # targets are a job apiece. needs alone would only skip this job when one of
  # them failed, and a skipped job is not a failed one, so it runs whenever the
  # run was not cancelled and reads the two results itself. A matrix reports
  # success only when every job in it succeeded, which is what makes one
  # comparison enough.
  #
  # !cancelled() rather than always(), which GitHub recommends against: always()
  # holds a job open through a cancellation, and a workflow cancelling itself is
  # routine here — cancel-in-progress above ends the previous run on every push
  # to a branch already building. That run would then report this check red for
  # results that read "cancelled", which is not a fuzz failure. The expression is
  # wrapped because a bare ! opens a YAML tag.
  fuzz:
    needs:
      - fuzz-list
      - fuzz-target
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check that every target was fuzzed
        env:
          LIST_RESULT: ${{ needs.fuzz-list.result }}
          TARGET_RESULT: ${{ needs.fuzz-target.result }}
        run: |
          echo "fuzz-list: $LIST_RESULT"
          echo "fuzz-target: $TARGET_RESULT"
          if [ "$LIST_RESULT" != "success" ] || [ "$TARGET_RESULT" != "success" ]; then
            exit 1
          fi

  build:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: go build

  lint:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check that every file is formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: golangci-lint run --verbose
      - run: go fix -diff ./...

  betterleaks:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: betterleaks git
